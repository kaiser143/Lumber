name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Liquid Glass 需要 macOS 26 SDK；与 CI 保持一致。
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: ./package-app.sh dist/Lumber.app

      - name: Zip app
        run: |
          ditto -c -k --keepParent dist/Lumber.app \
            "dist/Lumber-${{ steps.version.outputs.version }}-macos.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lumber ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Lumber-${{ steps.version.outputs.version }}-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
