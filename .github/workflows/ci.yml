name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 本仓库的 Actions 策略只允许 kaiser143 名下的 action 且必须 pin 到完整 SHA，
# 所以这里不使用任何第三方 action：checkout 用 runner 自带的 git 完成。
jobs:
  build-and-test:
    # Liquid Glass（glassEffect）要求 macOS 26 SDK。
    runs-on: macos-26

    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 --no-tags origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
